[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "string-technique-transfer"
version = "0.3.1"
description = "Instrument-agnostic technique-transfer for string spectral metrics (exploratory; see AUDIT_RESPONSE.md)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
bayes = [
  "pymc==5.16.2",
  "bambi==0.14.0",
  "arviz==0.19.0",
  "pytensor==2.25.2",
]

[project.scripts]
stt = "string_technique_transfer.cli:main"
stt-gui = "string_technique_transfer.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["string_technique_transfer*"]
